[GENERAL]
log_level = 3
input_dir = <PATH>/hermesv3_bu/hermesv3_bu_data_test
data_path = <PATH>/hermesv3_bu/hermesv3_bu_data_test/common
output_dir = <PATH>/hermesv3_bu/OUT
output_name = HERMESv3_<date>_traffic_test.nc
emission_summary = 0
start_date = 2022/02/02 00:00:00
output_timestep_num = 24

# Forzar regeneración del grid auxiliar
auxiliary_files_path = <PATH>/hermesv3_bu/hermesv3_bu_aux/d03_1km
first_time = 0
erase_auxiliary_files = 0

[DOMAIN]
domain_type = lcc
output_model = DEFAULT
compression_level = 0
vertical_description = <input_dir>/profiles/vertical/DEFAULT_6layers_vertical_description.csv

lat_1 = 38
lat_2 = 44
lon_0 = 1.7
lat_0 = 41.7
nx = 120
ny = 120
inc_x = 5000
inc_y = 5000
x_0 = -300000
y_0 = -300000
[CLIPPING]
# opcional, se puede comentar si no hay shapefile local
# clipping = <input_dir>/shapefiles/asuncion/asuncion.shp

####################################################################
#                           SECTORES ACTIVOS
####################################################################
[SECTOR MANAGEMENT]
writing_processors = 1
traffic_processors = 1

# desactivar los demás sectores
livestock_processors = 0
solvents_processors = 0
point_sources_processors = 0
residential_processors = 0
aviation_processors = 0
shipping_port_processors = 0
traffic_area_processors = 0
crop_operations_processors = 0
crop_fertilizers_processors = 0
agricultural_machinery_processors = 0
recreational_boats_processors = 0
fugitive_fossil_fuels_processors = 0

####################################################################
#                           TRÁFICO
####################################################################
[TRAFFIC SECTOR]
do_hot = 1
do_cold = 0
do_tyre_wear = 1
do_brake_wear = 1
do_road_wear = 1
do_resuspension = 1
resuspension_correction = 0
write_rline = 0

traffic_pollutants = nox_no2, nh3, co, so2, pm, voc, ch4
vehicle_types = PCD_13 PCD_14 PCG_25
load = 0.5

road_link_path = <input_dir>/traffic/road_links/road_links.shp
fleet_compo_path = <input_dir>/traffic/fleet_compo/fleet_compo_profiles.csv
traffic_ef_path = <input_dir>/traffic/ef
traffic_speed_hourly_path = <input_dir>/profiles/temporal/traffic/speed_hourly.csv
traffic_monthly_profiles = <input_dir>/profiles/temporal/traffic/aadt_m_mn.csv
traffic_weekly_profiles = <input_dir>/profiles/temporal/traffic/aadt_week.csv
traffic_hourly_profiles_mean = <input_dir>/profiles/temporal/traffic/aadt_h_mn.csv
traffic_hourly_profiles_weekday = <input_dir>/profiles/temporal/traffic/aadt_h_wd.csv
traffic_hourly_profiles_saturday = <input_dir>/profiles/temporal/traffic/aadt_h_sat.csv
traffic_hourly_profiles_sunday = <input_dir>/profiles/temporal/traffic/aadt_h_sun.csv
traffic_speciation_profile_hot_cold = <input_dir>/profiles/speciation/traffic/hot_cold_base.csv
traffic_speciation_profile_tyre = <input_dir>/profiles/speciation/traffic/tyre_base.csv
traffic_speciation_profile_road = <input_dir>/profiles/speciation/traffic/road_base.csv
traffic_speciation_profile_brake = <input_dir>/profiles/speciation/traffic/brake_base.csv
traffic_speciation_profile_resuspension = <input_dir>/profiles/speciation/traffic/resuspension_base.csv
#traffic_scenario = <input_dir>/traffic

####################################################################
#                        DATOS DE ESPECIACIÓN
####################################################################
[SPECIATION DATA]
speciation_map = <input_dir>/profiles/speciation/map_base.csv
molecular_weights = <input_dir>/profiles/speciation/MolecularWeights.csv
